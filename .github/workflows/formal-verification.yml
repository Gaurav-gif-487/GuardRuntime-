name: Formal verification (manual)

# The full TLA+ model has a very large state space and may not finish within
# a normal CI time limit, so this job is started manually.
on:
  workflow_dispatch:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./scripts/run-formal-verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlc-results
          path: research/docs/formal/results/
