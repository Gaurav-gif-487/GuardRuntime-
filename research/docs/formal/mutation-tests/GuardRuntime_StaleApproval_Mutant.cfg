CONSTANTS
  t1 = t1
  t2 = t2
  p1 = p1
  p2 = p2
  a1 = a1
  a2 = a2
  s1 = s1
  s2 = s2
  s3 = s3
  v1 = v1
  v2 = v2
  Tenants = {t1, t2}
  Principals = {p1, p2}
  Actions = {a1, a2}
  AuthStates = {s1, s2, s3}
  PolicyVersions = {v1, v2}
  HighImpactActions = {a1}

SPECIFICATION Spec

INVARIANT CacheHitNeverGrantsAuthorization
INVARIANT MeaningfulChangeInvalidatesApproval
INVARIANT StaleApprovalCannotReplay
INVARIANT CurrentAuthorizationAtExecution
INVARIANT HighImpactActionsRequireConfirmation
INVARIANT NoExecutionWhenUnhealthyWithoutConfirmation
INVARIANT SecuritySignificantDecisionsExplainable

CONSTRAINT StateConstraint
